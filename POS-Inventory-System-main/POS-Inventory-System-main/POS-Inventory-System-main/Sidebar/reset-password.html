<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Password - Bonbon Kitchen</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <!-- Left Side - Landscape Background -->
        <div class="logo-section landscape-bg">
            <div class="landscape-content">
                <div class="cloud"></div>
                <div class="hill hill-light"></div>
                <div class="hill hill-dark"></div>
            </div>
        </div>

        <!-- Right Side - Reset Password Form -->
        <div class="form-section">
            <div class="form-wrapper">
                <h1 class="welcome-text centered">Forgot Password</h1>
                <p class="form-subtitle centered">Please kindly set your new password</p>
                
                <form id="resetPasswordForm" class="auth-form">
                    <div class="form-group">
                        <input 
                            type="password" 
                            id="newPassword" 
                            name="newPassword" 
                            placeholder="New Password" 
                            required 
                            class="form-input"
                            minlength="6"
                        >
                        <button 
                            type="button" 
                            class="toggle-password" 
                            id="toggleNewPassword"
                            aria-label="Toggle password visibility"
                        >
                            <span class="eye-icon">✓</span>
                        </button>
                    </div>

                    <div class="form-group">
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            name="confirmPassword" 
                            placeholder="Re-enter Password" 
                            required 
                            class="form-input"
                        >
                        <button 
                            type="button" 
                            class="toggle-password" 
                            id="toggleConfirmPassword"
                            aria-label="Toggle password visibility"
                        >
                            <span class="eye-icon">👁</span>
                        </button>
                    </div>

                    <button type="submit" class="submit-btn">Confirm Password</button>
                </form>

                <div class="signup-link">
                    <p><a href="login.html">Back to Sign In</a></p>
                </div>

                <div id="errorMessage" class="error-message" style="display: none;"></div>
            </div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>

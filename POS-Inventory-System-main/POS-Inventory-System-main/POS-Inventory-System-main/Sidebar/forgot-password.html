<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Bonbon Kitchen</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <!-- Left Side - Landscape Background -->
        <div class="logo-section landscape-bg">
            <div class="landscape-content">
                <div class="cloud"></div>
                <div class="hill hill-light"></div>
                <div class="hill hill-dark"></div>
            </div>
        </div>

        <!-- Right Side - Forgot Password Form -->
        <div class="form-section">
            <div class="form-wrapper">
                <h1 class="welcome-text centered">Forgot Password</h1>
                <p class="form-subtitle centered">Please enter your email address to receive a verification code</p>
                
                <form id="forgotPasswordForm" class="auth-form">
                    <div class="form-group">
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="Email" 
                            required 
                            class="form-input"
                        >
                    </div>

                    <button type="submit" class="submit-btn">Send Code</button>
                    
                    <div class="skip-link">
                        <a href="reset-password.html" class="skip-code-link">I didn't receive a code</a>
                    </div>
                </form>

                <div class="signup-link">
                    <p><a href="login.html">Back to Sign In</a></p>
                </div>

                <div id="errorMessage" class="error-message" style="display: none;"></div>
            </div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
